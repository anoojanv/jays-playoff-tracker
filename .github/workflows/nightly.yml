name: Tracker build & deploy

on:
  schedule:
    # Poll every 30 minutes from 4pm to 2am Eastern — the window in which games actually
    # finish, from afternoon starts through West Coast nights that end around 1am. Times
    # are UTC and the season runs on EDT (UTC-4), so 4pm–2am ET is 20:00–06:00 UTC and
    # wraps midnight. Offset to :07/:37 on purpose: GitHub's scheduler is busiest on the
    # hour and delays runs that pile up there.
    - cron: "7,37 20-23 * * *"
    - cron: "7,37 0-5 * * *"
    # One guaranteed full rebuild a day at 3:13am Eastern (07:13 UTC), which runs whether
    # or not anything changed, so the Baseball-Reference comparison stays fresh.
    - cron: "13 7 * * *"
  push:
    branches: [main]          # so the very first push proves the setup end to end
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:          # lets you run it on demand from the Actions tab
    inputs:
      no_deploy:
        description: "Build only, do not publish"
        type: boolean
        default: false

concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  contents: read              # the job never writes to the repo

env:
  SEASON: "2026"
  SEASON_END: "2026-10-04"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The cheap poll. Deliberately before setup-python and pip: check_changed.py is
      # standard library only, so a poll that finds nothing new is a checkout and a
      # couple of seconds of stdlib Python — no toolchain, no numpy.
      - name: Has anything finished since the last publish?
        id: check
        env:
          SITE_URL: https://jays-playoff-tracker.netlify.app
          # anything that is not a polling tick rebuilds unconditionally
          FORCE_BUILD: ${{ (github.event_name != 'schedule' || github.event.schedule == '13 7 * * *') && 'true' || '' }}
        run: python3 src/check_changed.py

      - uses: actions/setup-python@v5
        if: steps.check.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: pip install -r requirements.txt

      - name: Build the tracker
        if: steps.check.outputs.changed == 'true'
        run: python src/build.py

      - name: Upload the page as an artifact
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracker-${{ github.run_number }}
          path: public/index.html
          retention-days: 14

      - name: Deploy to Netlify
        if: >-
          steps.check.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.no_deploy != true)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID || '0a3e85c0-7356-4468-9b79-3d97c57dce8c' }}
        run: |
          set -uo pipefail
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is not set — see README step 3."
            exit 1
          fi

          # Pre-flight. The check above only proves the secret is non-empty, which is why
          # an expired token surfaced as a bare "Unauthorized: could not retrieve site"
          # half a minute into the deploy, and left the page stale for days. Ask Netlify
          # directly instead, and say what to do about it.
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" || echo 000)
          case "$code" in
            200)
              echo "Netlify auth OK for site $NETLIFY_SITE_ID"
              ;;
            401|403)
              echo "::error::Netlify rejected the token (HTTP $code) — it has expired, been revoked, or lost access to site $NETLIFY_SITE_ID. Mint a new one (README step 2) and update the NETLIFY_AUTH_TOKEN secret. The page built fine; only publishing is blocked."
              exit 1
              ;;
            404)
              echo "::error::Netlify has no site $NETLIFY_SITE_ID visible to this token. If the site was recreated or moved team, set the NETLIFY_SITE_ID repository variable to the new ID."
              exit 1
              ;;
            *)
              echo "::warning::Could not pre-check Netlify (HTTP $code) — attempting the deploy anyway."
              ;;
          esac

          # Retry transient failures only. Anything authentication-shaped already exited
          # above, so this never burns attempts on something a retry cannot fix.
          for attempt in 1 2 3; do
            if npx --yes netlify-cli@17 deploy --prod --dir public --site "$NETLIFY_SITE_ID" --message "build ${{ github.run_number }}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Deploy attempt $attempt failed — retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done
          echo "::error::Netlify deploy failed three times. The page built and is attached to this run as an artifact; only publishing failed."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Blue Jays tracker"
            echo ""
            if [ "${{ steps.check.outputs.changed }}" != "true" ]; then
              echo "- No games have finished since the last publish — skipped the build."
            elif [ -f public/index.html ]; then
              echo "- Built \`public/index.html\` ($(du -h public/index.html | cut -f1))"
            else
              echo "- Build failed — nothing published"
            fi
            echo "- Live: https://jays-playoff-tracker.netlify.app"
          } >> "$GITHUB_STEP_SUMMARY"
