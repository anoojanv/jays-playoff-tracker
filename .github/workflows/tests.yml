name: Tests

# Runs on code changes only, never on the nightly schedule, so it costs nothing against
# the polling budget. Both self-tests are fully offline — they read tests/fixture_data.json
# and stub the network — so this needs no secrets and cannot be broken by the NHL API being down.

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  pull_request:
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: The fixture is reproducible
        run: |
          python tests/make_fixture.py
          git diff --exit-code tests/fixture_data.json \
            || { echo "::error::tests/fixture_data.json is stale — re-run python tests/make_fixture.py and commit it."; exit 1; }

      - name: NHL fetch layer, network mocked
        run: python src/selftest_fetch.py

      - name: Standings built from the schedule
        run: python tests/test_reconcile.py

      - name: Polling decision, every path
        run: python src/selftest_check.py

      - name: The Refresh button's endpoint, GitHub mocked
        run: node tests/test_refresh.mjs

      - name: Day-over-day history and deltas
        run: python tests/test_history.py

      - name: Points, overtime and the tiebreak
        run: python tests/test_points.py

      - name: Strength of schedule
        run: python tests/test_sos.py

      - name: Momentum rating semantics
        run: python tests/test_momentum.py

      - name: Rival lists come from the standings
        run: python tests/test_rivals.py

      - name: Scoring the games Toronto is not playing
        run: python tests/test_spoiler.py

      - name: Seeding and drawing the bracket
        run: python tests/test_bracket.py

      - name: The page builds preseason, mid-season and once the race is decided
        run: python tests/test_endgame.py

      - name: Full pipeline against the fixture
        run: |
          mkdir -p build
          cp tests/fixture_data.json build/data.json
          python src/build.py --no-fetch
